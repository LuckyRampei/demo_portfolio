<!DOCTYPE html>
<html>

<head>
    <title>Contact</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px gray;
            width: 60%;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #007689;
        }

        h2 {
            color: #cf2bb1;
        }

        p {
            font-size: 16px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #007689;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #005f6b;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Contact Me</h1>

        <p>
            Feel free to contact me for collaboration or learning opportunities.
        </p>

        <h2>Contact Details</h2>

        <p><b>Name:</b> JEENALE </p>
        <p><b>Email:</b> jeenale@example.com</p>
        <p><b>Phone:</b> +91 9012345678</p>
        <p><b>Location:</b> ABC Colony, Manipur, India</p>

        <h2>Send a Message</h2>

        <form>

            Name:<br>
            <input type="text"><br><br>

            Email:<br>
            <input type="email"><br><br>

            Message:<br>
            <textarea rows="5"></textarea><br><br>

            <input type="submit" value="Send">

        </form>

    </div>

</body>

</html>
